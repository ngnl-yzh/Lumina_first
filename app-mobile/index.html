<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      모바일 전용. viewport-fit=cover가 있어야 노치 영역까지 그릴 수 있고,
      user-scalable=no로 통화 중 실수로 확대되는 것을 막는다.
      maximum-scale=1은 iOS에서 입력 포커스 시 자동 확대를 막는다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14202B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="미리내" />
    <meta name="description" content="보이스피싱 경고 · 딥보이스 학습 방지" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>미리내</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
